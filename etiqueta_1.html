<style>
@page {
    size: 80mm 100mm;
    margin: 0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: Arial, sans-serif;
}

.etiqueta {
    width: 80mm;
    height: 100mm;
    padding: 7mm 6mm 6mm;
    overflow: hidden;
    break-after: page;
    page-break-after: always;
}

.etiqueta:last-child {
    break-after: auto;
    page-break-after: auto;
}

.cabecalho {
    height: 20mm;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 2mm;
}

.logo {
    width: 58mm;
    max-height: 16mm;
    object-fit: contain;
}

.marca {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 23pt;
    font-style: italic;
    font-weight: 900;
    line-height: 1;
    text-align: center;
}

.marca small {
    display: block;
    margin-top: 1mm;
    font-family: Arial, sans-serif;
    font-size: 9pt;
    font-weight: normal;
    letter-spacing: 3px;
}

.linha {
    display: flex;
    align-items: center;
    min-width: 0;
    height: 10mm;
}

.rotulo {
    flex-shrink: 0;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 18pt;
    font-weight: 900;
}

.sublinhado {
    text-decoration: underline;
    text-underline-offset: 1mm;
}

.valor {
    min-width: 0;
    margin-left: 2mm;
    font-size: 16pt;
    font-weight: 800;
    line-height: 1;
    overflow: hidden;
    text-overflow: clip;
    white-space: nowrap;
}

.rodape {
    height: 22mm;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 2mm;
}

.paletes,
.volume {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 18pt;
    font-weight: 900;
    white-space: nowrap;
}

@media print {
    .acoes {
        display: none;
    }
}
</style>

<main class="etiqueta">
    <header class="cabecalho">
        {marca}
    </header>

    <div class="linha">
        <span class="rotulo sublinhado">{tipo_documento}</span>
        <span class="valor">{numero_documento}</span>
    </div>

    <div class="linha">
        <span class="rotulo">REM:</span>
        <span class="valor">{remetente}</span>
    </div>

    <div class="linha">
        <span class="rotulo sublinhado">DES:</span>
        <span class="valor">{destinatario}</span>
    </div>

    <div class="linha">
        <span class="rotulo">CID:</span>
        <span class="valor">{cidade}</span>
    </div>

    <footer class="rodape">
        <span class="paletes">{sequencia:02d}/{quantidade:02d} PLTS.</span>
        <span class="volume">VOL:{quantidade:02d}</span>
    </footer>
</main>
