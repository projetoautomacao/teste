<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Etiquetas de transporte</title>

<style>
@page {
    size: 80mm 100mm;
    margin: 0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: Arial, sans-serif;
}

.etiqueta {
    width: 80mm;
    height: 100mm;
    padding: 14mm 6mm 7mm;
    overflow: hidden;
    background: #fff;
    break-after: page;
    page-break-after: always;
}

.etiqueta:last-child {
    break-after: auto;
    page-break-after: auto;
}

/* Mantém todo o texto horizontal. */
.layout {
    width: 100%;
    height: 100%;
    position: static;
    transform: none;
}

.cabecalho {
    height: 18mm;
    display: flex;
    align-items: center;
    justify-content: center;
}

.marca {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 22pt;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    text-align: center;
}

.marca small {
    display: block;
    margin-top: 1mm;
    font-family: Arial, sans-serif;
    font-size: 9pt;
    font-weight: normal;
    letter-spacing: 3px;
}

.linha {
    display: flex;
    align-items: center;
    height: 10mm;
    min-width: 0;
}

.rotulo {
    flex-shrink: 0;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 18pt;
    font-weight: 900;
}

.sublinhado {
    text-decoration: underline;
    text-underline-offset: 1mm;
}

.valor {
    flex: 1;
    min-width: 0;
    margin-left: 2mm;
    font-size: 16pt;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
}

.rodape {
    height: 10mm;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 2mm;
}

.sequencia {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 22pt;
    font-weight: 900;
    white-space: nowrap;
}

.acoes {
    padding: 12px;
    font-size: 14px;
}

@media print {
    .acoes {
        display: none;
    }
}
</style>
</head>

<body>
<div class="acoes">
    <button onclick="imprimir()">Imprimir todas as etiquetas</button>
    <p>Papel 80 × 100 mm, escala 100% e sem cabeçalhos e rodapés.</p>
</div>

<div class="lote">

    <main class="etiqueta">
        <div class="layout">
            <header class="cabecalho">
                <div class="marca">
                    TRANSANCHES
                    <small>TRANSPORTES</small>
                </div>
            </header>

            <div class="linha">
                <span class="rotulo sublinhado">CTE:</span>
                <span class="valor">118497</span>
            </div>

            <div class="linha">
                <span class="rotulo">REM:</span>
                <span class="valor">CARBON</span>
            </div>

            <div class="linha">
                <span class="rotulo sublinhado">DES:</span>
                <span class="valor">ROM MASTER</span>
            </div>

            <div class="linha">
                <span class="rotulo">CID:</span>
                <span class="valor">CURITIBA / PR</span>
            </div>

            <footer class="rodape">
                <span class="rotulo">PLT/VOL:</span>
                <span class="sequencia">1 / 2</span>
            </footer>
        </div>
    </main>

    <main class="etiqueta">
        <div class="layout">
            <header class="cabecalho">
                <div class="marca">
                    TRANSANCHES
                    <small>TRANSPORTES</small>
                </div>
            </header>

            <div class="linha">
                <span class="rotulo sublinhado">CTE:</span>
                <span class="valor">118497</span>
            </div>

            <div class="linha">
                <span class="rotulo">REM:</span>
                <span class="valor">CARBON</span>
            </div>

            <div class="linha">
                <span class="rotulo sublinhado">DES:</span>
                <span class="valor">ROM MASTER</span>
            </div>

            <div class="linha">
                <span class="rotulo">CID:</span>
                <span class="valor">CURITIBA / PR</span>
            </div>

            <footer class="rodape">
                <span class="rotulo">PLT/VOL:</span>
                <span class="sequencia">2 / 2</span>
            </footer>
        </div>
    </main>

</div>

<script>
function imprimir() {
    window.print();
}
</script>
</body>
</html>
